<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#FF8A00">
  <meta name="description" content="Proposta indipendente di sito. Contenuti e materiali da confermare.">
  <title>Proposta di sito — demo</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preload" href="fonts/bricolage-grotesque.ttf" as="font" type="font/ttf" crossorigin>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#contenuto">Vai al contenuto</a>
  <div class="demo-bar"><span class="demo-dot" aria-hidden="true"></span><span data-copy="demo.bar"></span></div>
  <header class="site-header">
    <div class="header-inner wrap">
      <a class="brand" href="#inizio" aria-label="Inizio pagina"><span data-copy="name"></span><span class="brand-place" data-copy="city"></span></a>
      <button class="nav-toggle" type="button" aria-controls="navigazione" aria-expanded="false" hidden><span data-copy="labels.navigation"></span><span class="toggle-mark" aria-hidden="true"></span></button>
      <nav id="navigazione" class="nav" aria-label="Navigazione principale">
        <a href="#menu" data-copy="labels.menu"></a>
        <a href="#ristorante" data-copy="labels.restaurant"></a>
        <a href="#contatti" data-copy="labels.contacts"></a>
        <a class="button button-small button-dark" data-link="phone"><span data-copy="labels.call"></span><span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main id="contenuto">
    <section class="hero" id="inizio" aria-labelledby="hero-title">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <p class="eyebrow"><span class="small-star" aria-hidden="true">✳</span><span data-copy="hero.eyebrow"></span></p>
          <h1 id="hero-title"><span data-copy="hero.title.0"></span><span data-copy="hero.title.1"></span><span class="last-line" data-copy="hero.title.2"></span></h1>
          <p class="hero-intro" data-copy="hero.intro"></p>
          <div class="hero-actions">
            <a class="button button-dark" href="#menu"><span data-copy="hero.primary"></span><span aria-hidden="true">↓</span></a>
            <a class="text-link" href="#contatti"><span data-copy="labels.directions"></span><span aria-hidden="true">↗</span></a>
          </div>
          <p class="hero-location" data-copy="hero.location"></p>
        </div>

        <div class="hero-visual" aria-hidden="true">
          <div class="visual-heading"><span data-copy="art.top"></span><span>01—03</span></div>
          <div class="stack-art">
            <div class="art-sheet sheet-one"><span class="sheet-number">01</span><span class="sheet-title" data-copy="art.layers.0"></span><span class="sheet-end">↗</span></div>
            <div class="art-sheet sheet-two"><span class="sheet-number">02</span><span class="sheet-title" data-copy="art.layers.1"></span><span class="sheet-end">↗</span></div>
            <div class="art-sheet sheet-three"><span class="sheet-number">03</span><span class="sheet-title" data-copy="art.layers.2"></span><span class="sheet-end">↗</span></div>
          </div>
          <div class="visual-bottom"><span data-copy="art.bottom"></span><span class="mini-grid"><i></i><i></i><i></i><i></i></span></div>
        </div>
      </div>
      <div class="hero-strip"><div class="wrap strip-inner"><span data-copy="strip.0"></span><span class="strip-star" aria-hidden="true">✳</span><span data-copy="strip.1"></span><span class="strip-star" aria-hidden="true">✳</span><span data-copy="strip.2"></span></div></div>
    </section>

    <section class="menu-section section wrap" id="menu" aria-labelledby="menu-title">
      <div class="section-heading">
        <p class="eyebrow" data-copy="menu.eyebrow"></p>
        <div class="heading-grid"><h2 id="menu-title" data-copy="menu.title"></h2><p class="section-intro" data-copy="menu.intro"></p></div>
      </div>
      <div class="confirmation menu-confirmation"><span class="confirmation-tag" data-copy="pending.label"></span><p data-copy="menu.pending"></p></div>
      <div class="menu-toolbar">
        <div id="menu-filters" class="filters" role="group" aria-label="Filtra le ricette"></div>
        <p id="menu-count" class="menu-count" role="status" aria-live="polite" aria-atomic="true"></p>
      </div>
      <div id="menu-list" class="menu-list"></div>
      <div class="menu-footer"><p data-copy="menu.footer"></p><a class="text-link" data-link="phone"><span data-copy="menu.contact"></span><span aria-hidden="true">↗</span></a></div>
    </section>

    <section class="restaurant-section" id="ristorante" aria-labelledby="restaurant-title">
      <div class="wrap section restaurant-grid">
        <div class="restaurant-copy"><p class="eyebrow" data-copy="restaurant.eyebrow"></p><h2 id="restaurant-title"><span data-copy="restaurant.title.0"></span><span data-copy="restaurant.title.1"></span></h2><p class="section-intro" data-copy="restaurant.intro"></p><div class="type-art" aria-hidden="true"><span>LASA</span><span>GNAS</span><i>↗</i></div></div>
        <div class="service-list">
          <article class="service"><div class="service-top"><span class="service-index">01</span><span class="service-label" data-copy="restaurant.table.label"></span></div><h3 data-copy="restaurant.table.title"></h3><p data-copy="restaurant.table.description"></p><a class="button button-dark" data-link="phone"><span data-copy="labels.call"></span><span aria-hidden="true">↗</span></a></article>
          <article class="service"><div class="service-top"><span class="service-index">02</span><span class="service-label" data-copy="restaurant.delivery.label"></span></div><h3 data-copy="restaurant.delivery.title"></h3><p data-copy="restaurant.delivery.description"></p><div class="delivery-links"><a class="text-link" data-link="deliveroo" target="_blank" rel="noopener noreferrer"><span data-copy="labels.deliveroo"></span><span aria-hidden="true">↗</span><span class="sr-only">, si apre in una nuova scheda</span></a><a class="text-link" data-link="glovo" target="_blank" rel="noopener noreferrer"><span data-copy="labels.glovo"></span><span aria-hidden="true">↗</span><span class="sr-only">, si apre in una nuova scheda</span></a></div></article>
        </div>
      </div>
    </section>

    <section class="contact-section" id="contatti" aria-labelledby="contact-title">
      <div class="wrap section">
        <p class="eyebrow" data-copy="contact.eyebrow"></p>
        <div class="contact-grid">
          <div class="contact-title"><h2 id="contact-title"><span data-copy="contact.title.0"></span><span data-copy="contact.title.1"></span></h2><a class="button button-dark" data-link="maps" target="_blank" rel="noopener noreferrer"><span data-copy="labels.directions"></span><span aria-hidden="true">↗</span><span class="sr-only">, apre Google Maps in una nuova scheda</span></a></div>
          <div class="contact-details">
            <div class="contact-row"><h3 data-copy="contact.addressLabel"></h3><p data-copy="contact.address"></p><p class="small-pending"><span data-copy="pending.label"></span> <span data-copy="contact.addressPending"></span></p></div>
            <div class="contact-row"><h3 data-copy="contact.hoursLabel"></h3><p class="small-pending"><span data-copy="pending.label"></span></p><p class="contact-small" data-copy="contact.hoursPending"></p></div>
            <div class="contact-row"><h3 data-copy="contact.phoneLabel"></h3><a class="phone-link" data-link="phone" data-copy="phoneDisplay"></a></div>
            <div class="contact-row contact-social"><h3 data-copy="contact.socialLabel"></h3><a class="text-link" data-link="instagram" target="_blank" rel="noopener noreferrer"><span data-copy="instagramDisplay"></span><span aria-hidden="true">↗</span><span class="sr-only">, apre Instagram in una nuova scheda</span></a></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-top"><a class="footer-brand" href="#inizio" data-copy="name"></a><p data-copy="hero.intro"></p><a class="back-top text-link" href="#inizio"><span data-copy="labels.backTop"></span><span aria-hidden="true">↑</span></a></div>
    <div class="wrap footer-bottom">
      <p data-copy="demo.footer"></p>
      <details class="project-notes"><summary data-copy="demo.notesTitle">Note e contenuti da confermare</summary><div class="notes-body"><p data-copy="demo.materials"></p><p data-copy="demo.content"></p><p data-copy="demo.privacy"></p><ul id="source-links" class="source-links"></ul></div></details>
    </div>
  </footer>
  <nav class="mobile-actions" aria-label="Azioni rapide" hidden><a class="button button-light" href="#menu" data-copy="labels.menu"></a><a class="button button-dark" data-link="phone"><span data-copy="labels.shortCall"></span><span aria-hidden="true">↗</span></a></nav>
  <noscript><div class="noscript-notice">Attiva JavaScript per visualizzare questa proposta di sito e il suo menu. I contenuti della demo richiedono conferma del locale.</div></noscript>
</body>
</html>
